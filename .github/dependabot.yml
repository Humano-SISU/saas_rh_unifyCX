# Monthly version updates, grouped so they arrive as one PR per ecosystem.
# Security updates are separate: enable "Dependabot security updates" in the
# repo settings and they open as soon as an advisory affects a dependency.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /services/hikvision-proxy
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
